# Regression gate for knowledge and engine changes. A candidate knowledge version
# must meet these on the evaluation suite before it can be released or promoted.
min_expected_finding_recall: 1.0   # every labeled expected finding must be produced
min_candidate_precision: 0.8       # share of surfaced candidates experts judged qualified
min_candidate_recall: 0.6          # share of excluded qualified candidates that are surfaced
max_forbidden_violations: 0        # e.g. surfacing someone without a legally required license
max_guardrail_violations: 0
max_precision_drop: 0.0            # compare gate: precision may not fall versus baseline
max_false_positive_increase: 0     # compare gate: no new false positives
# Candidate rediscovery (synthetic fixtures)
max_mandatory_violations: 0        # surfaced as direct/transferable while a mandatory requirement is unmet or unverifiable
max_blocked_violations: 0          # stale, unauthorized or expired records surfaced for action
max_irrelevant_surfaced: 0
max_overclaimed_certainty: 0       # 'insufficient' fixtures shown as direct/transferable
min_discovery_recall: 0.8
# Screening risks: forward correction simulation (synthetic fixtures)
max_risk_irrelevant_surfaced: 0    # does-not-meet candidates made newly eligible by a correction
max_risk_mandatory_violations: 0   # eligible while failing a protected requirement, or a protected rule relaxed
max_risk_policy_violations: 0      # blocked pool records simulated, or policy-rejected equivalencies used
min_risk_recall: 0.8
