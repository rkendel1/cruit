# Skills and capability relationships.
# Skills are structured, contextual capabilities — not a flat keyword list.
# Only records with review_status: approved are used by the engine.
document: skills
schema_version: 1

records:
  # ---------------------------------------------------------------- software infrastructure
  - id: skill.site-reliability-engineering
    name: Site reliability engineering
    kind: capability
    definition: >-
      Applying software engineering to operate production systems reliably at scale:
      service-level objectives, automation of operational work, incident response and
      capacity planning.
    alternate_names: []
    relationships:
      - { type: closely_related, target: skill.production-operations, note: "Production operations is the operational core of SRE; SRE adds software-engineering practice." }
      - { type: prerequisite, target: skill.incident-management }
      - { type: closely_related, target: skill.observability }
    proficiency_levels:
      - { level: working, description: "Operates and automates production services with defined SLOs." }
      - { level: advanced, description: "Designs reliability practices and leads incident response across services." }
    evidence_types: [job responsibilities, on-call history, automation built, SLO ownership]
    contexts: [software-infrastructure]
    confidence: high
    version: 1
    review_status: approved
    provenance: { author: seed-knowledge, created: 2026-10-01, sources: ["MVP seed knowledge; pending design-partner validation"] }

  - id: skill.production-operations
    name: Production operations
    kind: capability
    definition: >-
      Running and supporting live production systems: availability, monitoring, change
      management, on-call and recovery.
    alternate_names: [IT operations, systems operations, infrastructure operations, operations engineering, platform operations, network operations]
    relationships:
      - { type: closely_related, target: skill.site-reliability-engineering }
      - { type: not_equivalent, target: skill.it-service-desk, note: "Ticket handling without ownership of production systems is not production operations." }
    evidence_types: [job responsibilities, on-call history, systems owned]
    contexts: [software-infrastructure]
    confidence: high
    version: 1
    review_status: approved
    provenance: { author: seed-knowledge, created: 2026-10-01, sources: ["MVP seed knowledge; pending design-partner validation"] }

  - id: skill.incident-management
    name: Incident management
    kind: capability
    definition: >-
      Leading the response to service-impacting events: coordinating responders, restoring
      service, communicating status and driving post-incident learning.
    alternate_names: [incident response, incident command, incident commander, major incident management]
    relationships:
      - { type: closely_related, target: skill.post-incident-review }
      - { type: not_equivalent, target: skill.it-service-desk, note: "Triaging tickets is not leading incident response." }
    proficiency_levels:
      - { level: working, description: "Participates effectively as a responder." }
      - { level: advanced, description: "Leads response, coordinates teams and owns communications and reviews." }
    evidence_types: [incident command history, post-incident reviews authored, crisis response leadership]
    contexts: ["*"]
    confidence: high
    version: 1
    review_status: approved
    provenance: { author: seed-knowledge, created: 2026-10-01, sources: ["MVP seed knowledge; pending design-partner validation"] }

