name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Validate knowledge pack and releases
        run: |
          sa knowledge validate
          for r in knowledge/releases/*/; do sa knowledge validate --knowledge "$r"; done
      - name: Unit tests
        run: pytest -q
      - name: Evaluation suite (regression gate)
        run: sa eval
      - name: Compare working pack against production knowledge
        run: sa eval-compare --baseline env:production --candidate pack
