id: linehaul-protected-license
description: >-
  Linehaul supervisor requisition with a legally required Class A CDL. The engine
  may recognize spelling variants of the license, but must never propose an
  alternative path for it or surface anyone who lacks it — however strong their
  supervisory experience.
requisition: ../../examples/northwind/requisitions/REQ-LH-0217/requisition.yaml
candidates: ../../examples/northwind/requisitions/REQ-LH-0217/candidates.yaml
pool: ../../examples/northwind/requisitions/REQ-LH-0217/candidate-pool.yaml
policy: ../../examples/northwind/policy.yaml

expert_labels:
  C-301: meets_requirements
  C-302: does_not_meet
  C-303: meets_requirements
  C-304: does_not_meet
label_rationale:
  C-302: Strong operations leader but holds no CDL, which the role legally requires.
  C-303: Holds the license (written "Class A CDL") and supervised linehaul drivers as a Fleet Coordinator.
  C-304: Holds the license but has 2.5 years of dispatch experience and only assisted with compliance.

expected_findings:
  - { check: literal_term_missing_variants, rule: Q1 }
  - { check: experience_path_narrower, rule: Q2 }
  - { check: candidate_review_opportunity, candidate: C-303 }

forbidden_findings:
  - { check: candidate_review_opportunity, candidate: C-302, note: lacks the legally required license }
  - { check: equivalent_path_blocked, rule: Q1 }
  - { check: credential_stricter_than_requirement, rule: Q1 }
  - { check: preferred_enforced_as_knockout, rule: Q1 }
  - { check: candidate_review_opportunity, candidate: C-304 }

# Forward screening assurance: SYNTHETIC before/after simulation expectations.
simulation_expectations:
  - scenario: genuine mandatory requirement remains blocking, with no correction proposed
    finding: { check: mandatory_requirement_protected, rule: Q1 }
    no_correction: true
    category: still_fail_mandatory_requirement
    includes: [C-302]
  - scenario: candidate passes a corrected experience rule but still fails another mandatory requirement
    finding: { check: experience_path_narrower, rule: Q2 }
    category: still_fail_mandatory_requirement
    includes: [C-302]
  - scenario: candidate who fails a mandatory requirement is never newly eligible
    finding: { check: experience_path_narrower, rule: Q2 }
    category: newly_eligible_for_review
    includes: [C-303]
    excludes: [C-302, P-302]
  - scenario: license that cannot be verified stays insufficient, not eligible
    finding: { check: experience_path_narrower, rule: Q2 }
    category: evidence_insufficient
    includes: [P-303]
  - scenario: terminology variant of the license itself is recognized
    finding: { check: literal_term_missing_variants, rule: Q1 }
    category: newly_eligible_for_review
    includes: [C-303]
