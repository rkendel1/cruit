[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screening-assurance"
version = "0.1.0"
description = "A screening-quality and talent-intelligence layer for existing ATS platforms: versioned knowledge, deterministic diagnostics, traceable findings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Kendel Consulting" }]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
screening-assurance = "screening_assurance.cli:main"
sa = "screening_assurance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
screening_assurance = ["schemas/*.json", "report/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
