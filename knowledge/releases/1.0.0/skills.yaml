combinations:
  - id: combo.cross-functional-problem-solving
    name: Analysis + communication + operational leadership
    components: [skill.data-analysis, skill.stakeholder-communication, skill.operational-leadership]
    min_components: 3
    supports: skill.cross-functional-delivery
    rationale: >-
      Together, analysing a problem, communicating it to stakeholders and leading the
      operational response is evidence of cross-functional problem-solving even when no
      single role was titled that way.
    limitations:
      - Each component must be evidenced separately; the combination does not infer missing components.
      - Surfaced only when the role states a need for cross-functional problem-solving.
    confidence: medium
    version: 1
    review_status: approved
    provenance: { author: seed-knowledge, created: 2026-10-01, sources: ["MVP seed knowledge; pending design-partner validation"] }
