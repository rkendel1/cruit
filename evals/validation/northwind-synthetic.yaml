        - { candidate: C-302, outcome: rejected, excluded_by_rule: Q1, basis: observed }
        - { candidate: C-303, outcome: rejected, excluded_by_rule: Q2, basis: observed }
        - { candidate: C-304, outcome: rejected, basis: observed }
