        reviews: [{ reviewer: REV-C, judgment: relevant, mandatory: met, rationale: "Licensed with linehaul experience.", reviewed_at: "2026-10-12", saw_product_output: false }]
      - candidate: C-302
        reviews: [{ reviewer: REV-C, judgment: not_relevant, mandatory: not_met, rationale: "Experienced driver without the legally required licence.", reviewed_at: "2026-10-12", saw_product_output: false }]
      - candidate: C-303
        reviews: [{ reviewer: REV-C, judgment: relevant, mandatory: met, rationale: "Licensed; regional route experience is equivalent.", reviewed_at: "2026-10-12", saw_product_output: false }]
      - candidate: C-304
        reviews: [{ reviewer: REV-C, judgment: not_relevant, mandatory: not_met, rationale: "No licence and no driving experience.", reviewed_at: "2026-10-12", saw_product_output: false }]
      - candidate: P-301
        reviews: [{ reviewer: REV-C, judgment: relevant, mandatory: met, rationale: "Licensed linehaul driver in the pool.", reviewed_at: "2026-10-12", saw_product_output: false }]
      - candidate: P-302
        reviews: [{ reviewer: REV-C, judgment: not_relevant, mandatory: not_met, rationale: "Licence lapsed.", reviewed_at: "2026-10-12", saw_product_output: false }]
